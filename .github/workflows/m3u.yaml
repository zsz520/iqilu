name: update m3u file

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Run scripts
        run: |
          # 权威表 channel_names.csv → config.json 的 nameOverrides。
          # 必须在 filter-metadata 之前跑：后者直接读 config.json 里已生成的
          # nameOverrides 来改名，不读 CSV。缺了这一步，网页端改表不会生效。
          node actions/gen-name-overrides.js
          node actions/filter-metadata.js
          node actions/gen-m3u-generic.js
          node actions/gen-txt-ku9.js
          node actions/gen-m3u-direct.js
      - name: Set Git author
        run: |
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Make changes
        run: |
          git add .
          git commit -m "Update" || echo "No changes"
          git push
